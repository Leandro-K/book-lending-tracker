<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Lending Tracker</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Leandro-K/lt-css-library@v1.0.0/lt.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/gh/Leandro-K/lendtrack-js@v1.0.0/lendtrack.js"></script>
</head>
<body class="lt-page">
  <main class="lt-container">
    <header class="lt-mb-5">
      <h1 class="lt-h1">Book Lending Tracker</h1>
      <p class="lt-muted lt-m-0">Keep track of what you lent, to whom, and when it's due back.</p>
    </header>

    <nav class="lt-tabs" id="tabs" aria-label="Sections">
      <button class="lt-tab lt-tab--active" type="button" id="tab-lend" aria-controls="panel-lend">Lend a book</button>
      <button class="lt-tab" type="button" id="tab-loans" aria-controls="panel-loans">Loans <span class="lt-badge" id="loans-count">0</span></button>
      <button class="lt-tab" type="button" id="tab-summary" aria-controls="panel-summary">Summary</button>
    </nav>

    <section class="lt-tab-panel" role="tabpanel" id="panel-lend" aria-labelledby="tab-lend">
      <div class="lt-card lt-mb-5">
        <h2 class="lt-h2">Lend a book</h2>
        <form id="loan-form">
          <div class="lt-grid">
            <div class="lt-field">
              <label class="lt-label" for="title">Title</label>
              <div class="lt-field-row">
                <input class="lt-input" type="text" id="title" name="title" required>
                <span class="lt-field-msg" id="title-msg" aria-live="polite"></span>
              </div>
            </div>
            <div class="lt-field">
              <label class="lt-label" for="author">Author</label>
              <div class="lt-field-row">
                <input class="lt-input" type="text" id="author" name="author" required>
                <span class="lt-field-msg" id="author-msg" aria-live="polite"></span>
              </div>
            </div>
            <div class="lt-field">
              <label class="lt-label" for="borrower">Borrower</label>
              <div class="lt-field-row">
                <input class="lt-input" type="text" id="borrower" name="borrower" required>
                <span class="lt-field-msg" id="borrower-msg" aria-live="polite"></span>
              </div>
            </div>
            <div class="lt-field">
              <label class="lt-label" for="dueDate">Due date</label>
              <div class="lt-field-row">
                <input class="lt-input" type="date" id="dueDate" name="dueDate" required>
                <span class="lt-field-msg" id="dueDate-msg" aria-live="polite"></span>
              </div>
            </div>
            <div class="lt-field">
              <label class="lt-label" for="genre">Genre</label>
              <div class="lt-field-row">
                <select class="lt-input" id="genre" name="genre" required>
                  <option value="">Choose a genre</option>
                  <option>Fiction</option>
                  <option>Non-fiction</option>
                  <option>Science</option>
                  <option>History</option>
                  <option>Biography</option>
                  <option>Fantasy</option>
                  <option>Mystery</option>
                  <option>Textbook</option>
                  <option>Other</option>
                </select>
                <span class="lt-field-msg" id="genre-msg" aria-live="polite"></span>
              </div>
            </div>
          </div>
          <div class="lt-row lt-mt-5">
            <button class="lt-btn lt-btn--primary" type="submit">Add loan</button>
            <button class="lt-btn lt-btn--secondary" type="reset">Clear</button>
          </div>
        </form>
      </div>
    </section>

    <section class="lt-tab-panel" role="tabpanel" id="panel-loans" aria-labelledby="tab-loans">
      <div class="lt-card lt-mb-5">
        <h2 class="lt-h2">Lent books</h2>
        <div class="lt-scroll-x">
          <table class="lt-table">
            <thead>
              <tr>
                <th>Title</th>
                <th>Borrower</th>
                <th>Due date</th>
                <th>Genre</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="loan-table-body"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section class="lt-tab-panel" role="tabpanel" id="panel-summary" aria-labelledby="tab-summary">
      <div class="lt-grid">
        <div class="lt-stat">
          <span class="lt-stat-label">Total loans</span>
          <span class="lt-stat-value" id="total-loans">0</span>
        </div>
        <div class="lt-stat lt-stat--danger">
          <span class="lt-stat-label">Overdue loans</span>
          <span class="lt-stat-value" id="overdue-loans">0</span>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
